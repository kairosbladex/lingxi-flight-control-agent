# 灵犀智能助手同源聚合入口（任务下发 + 飞控）
#
# 目标：一个页面入口，两套助手各自独立部署、独立会话、独立授权。
# 本配置只做静态路由与反向代理，不改动 ktd_backend 和 onegismap_a。
#
# 部署前替换：
#   /var/www/lingxi/agent-hub/        宿主页（本仓库 web/agent-hub/）
#   /var/www/lingxi/flight-agent-ui/  飞控前端构建产物（lingxi-flight-agent-ui/dist）
#   127.0.0.1:5055                    任务下发 Agent（lingxi-agent）
#   127.0.0.1:8794                    飞控 Agent（tools/cockpit_server.py 或等价服务）
#
# 两个上游都应只监听回环地址；对外只暴露本入口。

upstream lingxi_task_agent {
    server 127.0.0.1:5055;
    keepalive 8;
}

upstream lingxi_flight_agent {
    server 127.0.0.1:8794;
    keepalive 8;
}

server {
    listen 8080;
    server_name _;

    # 聊天补参和模型调用可能持续数十秒；不要按普通静态请求的超时截断。
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    # 不设置 X-Frame-Options：宿主页需要能被平台页面或 iframe 嵌入。

    # 宿主页
    location = /agent-hub {
        return 301 /agent-hub/;
    }
    location /agent-hub/ {
        alias /var/www/lingxi/agent-hub/;
        try_files $uri $uri/ /agent-hub/index.html;
    }

    # 飞控前端（构建时 base 为 /flight-agent-ui/）
    location /flight-agent-ui/ {
        alias /var/www/lingxi/flight-agent-ui/;
        try_files $uri =404;
    }

    # 任务下发前端：上游页面挂在根路径，这里映射到 /task-dispatch/
    location /task-dispatch/ {
        proxy_pass http://lingxi_task_agent/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # 飞控 API：保留完整路径 /api/flight-control/...
    location /api/flight-control/ {
        proxy_pass http://lingxi_flight_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # 任务下发 API：保留完整路径 /api/...
    location ~ ^/api/(chat|health|status|settings|speech|algorithm|poi|region|control)(/|$) {
        proxy_pass http://lingxi_task_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # 其它路径不代理，避免把未配置的上游暴露出去。
    location / {
        return 404;
    }
}

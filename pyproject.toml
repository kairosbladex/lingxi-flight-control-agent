[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxi-flight-control-agent"
version = "0.1.0"
description = "灵犀飞行执行 Agent 的安全边界与内存模拟器"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

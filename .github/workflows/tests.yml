name: tests

# 每次提交/PR 都跑全量离线测试，挡住上下文预算、安全语义与工具契约的回归。
# 命令与本地完全一致：tools/ci/offline_tests.sh 里就是验证清单的那一条命令。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 运行时不依赖任何第三方包（见 pyproject.toml），因此无需 pip install。
      - name: Run offline unit tests
        run: bash tools/ci/offline_tests.sh
      # 合流门禁的确定性部分：适配器/并发/边界对抗/意图评测/E2E 冒烟/编译。
      # 注意：CI 不跑第二方评审（需要外部 Agent），因此用 --deterministic，
      # 该模式明确不可用于签署；签署必须由本地完整门禁 + redteam_review.json 完成。
      - name: Run adversarial gate (deterministic, not a sign-off)
        run: python3 tools/ci/adversarial_jury_evaluator.py --deterministic --no-offline
